<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}}; script-src 'nonce-{{nonce}}'; img-src {{cspSource}}; font-src {{cspSource}};">
  <link rel="stylesheet" href="{{styleUri}}">
  <title>AI Agent</title>
</head>
<body>
  <section class="agent" id="agent" data-view="chat" aria-label="AI Agent">
    <header class="agent-header">
      <strong>AI Agent</strong>
      <button class="icon" id="newChat" title="新建会话" aria-label="新建会话"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M11 4H4v12h12V9M11 9l6-6M13 3h4v4"/></svg></button>
      <button class="icon" id="toggleHistory" title="历史记录" aria-label="历史记录" aria-expanded="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 9a7 7 0 1 1 2 6M3 4v5h5M10 6v4l3 2"/></svg></button>
      <button class="icon" id="toggleSettings" title="设置" aria-label="设置" aria-expanded="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 3h4l.5 2 1.5 1 2-.5 2 3-1.5 1.5v2L18 13.5l-2 3-2-.5-1.5 1-.5 2H8l-.5-2L6 16l-2 .5-2-3L3.5 12v-2L2 8.5l2-3L6 6l1.5-1z" transform="translate(1 0) scale(.9)"/><circle cx="10" cy="10" r="2.6"/></svg></button>
    </header>
    <section class="panel history" id="historyPanel" aria-label="历史会话" aria-hidden="true" inert>
      <div class="panel-heading"><button class="icon" id="closeHistory" aria-label="返回对话">‹</button><h2>历史会话</h2></div>
      <p class="muted">继续之前的工作</p><div class="history-list" id="historyList"></div>
    </section>
    <section class="panel settings-panel" id="settingsPanel" aria-label="设置" aria-hidden="true" inert>
      <div class="panel-heading"><button class="icon" id="closeSettings" aria-label="返回对话">‹</button><h2>设置</h2></div>
      <form class="settings" id="settingsForm">
        <div class="settings-body">
          <p class="section-label">模型服务</p><p class="muted section-description">连接你使用的模型，保存后即可开始对话。</p>
          <div class="field"><label for="baseUrl">API 地址</label><input id="baseUrl" type="url" placeholder="https://api.example.com/v1" required autocomplete="off" spellcheck="false"><small>包含版本路径；局域网地址可使用 http://。</small></div>
          <div class="field"><div class="label-row"><label for="apiKey">API Key</label><span id="keyState"></span></div><input id="apiKey" type="password" placeholder="输入 Key，本地模型可留空" autocomplete="off"><small id="keyHint">已保存的 Key 无需重复填写。</small></div>
          <div class="field"><label for="model">模型</label><div class="row"><input id="model" list="modelList" placeholder="选择或输入模型名称" required autocomplete="off" spellcheck="false"><button class="secondary" type="button" id="fetchModels">获取模型</button></div><datalist id="modelList"></datalist><small>从填写的 API 获取，也可以手动输入。</small></div>
          <details><summary>高级设置</summary>
            <div class="field"><label for="approvalMode">操作确认</label><select id="approvalMode"><option value="ask">每次操作前确认（推荐）</option><option value="autoEdit">自动修改文件，命令仍需确认</option><option value="readOnly">只查看和解释代码</option></select></div>
            <div class="field"><label for="contextWindow">上下文窗口（token）</label><input id="contextWindow" type="number" min="2048" max="4000000" required></div>
            <div class="field"><label for="maxOutputTokens">单次回复最大输出（token）</label><input id="maxOutputTokens" type="number" min="256" max="1000000" required></div>
            <label class="check"><input id="autoContext" type="checkbox">自动附带当前文件与选区</label>
            <div class="field"><label for="allowedCommands">免确认的命令（每行一个前缀）</label><textarea id="allowedCommands" rows="3" placeholder="例如：npm test"></textarea></div>
            <div class="field"><label for="systemPromptExtra">自定义指令</label><textarea id="systemPromptExtra" rows="3" placeholder="例如：项目的代码规范"></textarea></div>
            <label class="check"><input id="clearKey" type="checkbox">清除已保存的 API Key</label>
          </details>
        </div>
        <div class="settings-actions"><div class="row"><button class="secondary" type="button" id="testConnection">测试连接</button><button class="primary" type="submit" id="saveSettings">保存设置</button></div><p class="result" id="formResult" role="status">支持 OpenAI 兼容接口</p></div>
      </form>
    </section>
    <main class="agent-scroll" id="scrollArea">
      <div class="thread-title" id="threadTitle" hidden></div>
      <div class="welcome" id="welcome"><div class="spark">✦</div><h1>有什么想一起完成的？</h1><p class="muted">从一个问题，或一个想法开始。</p><div class="suggestions"><button data-prompt="帮我理解这个项目的结构，只查看和说明，不修改文件。">了解这个项目　↗</button><button data-prompt="分析当前项目的报错，先说明原因，不修改文件。">分析当前报错　↗</button></div></div>
      <div class="messages" id="messages" aria-live="polite"></div>
    </main>
    <footer class="composer-area" id="composerArea"><button class="context" id="showContext" title="查看将随消息发送的上下文">未打开文件</button><div class="composer"><textarea id="messageInput" aria-label="任务描述" placeholder="提问、修改代码，或描述你的想法…" rows="3"></textarea><div class="composer-tools"><span class="model-state"><span class="dot" id="connectionDot"></span><span id="composerModel">正在连接…</span></span><button class="send" id="sendMessage" title="发送（Enter）" aria-label="发送" disabled>↑</button></div></div><div class="footnote" id="footnote">Enter 发送 · Shift + Enter 换行</div><div class="run-status" id="runStatus" role="status"></div><button class="text-button" id="undo" hidden>撤销上次修改</button></footer>
    <div class="saved-notice" id="savedNotice" role="status"></div>
  </section>
  <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
