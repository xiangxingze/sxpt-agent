name: Publish extension to Open VSX

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish sxpt-agent
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile extension
        run: npm run compile

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version $PACKAGE_VERSION does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Remove development dependencies
        run: npm prune --omit=dev

      - name: Package extension
        run: npx --yes @vscode/vsce package --allow-missing-repository

      - name: Publish to Open VSX
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          npx --yes ovsx publish --skip-duplicate -p "$OVSX_PAT" "./sxpt-agent-${PACKAGE_VERSION}.vsix"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
